<mat-select [placeholder]="placeholder" class="mat-select-container input {{width}}" #el (selectionChange)="updateValue(el)" [ngModel]="value" [ngModelOptions]="{ standalone: true }">
  @for (option of getOptions(); track option) {
    <mat-option [value]="option.value" [style.fontSize]="fontSize">
      {{ option.display }}
    </mat-option>
  }
</mat-select>

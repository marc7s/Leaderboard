@if (href) {
  <a [class]="['card', size]" [class.disabled]="disabled" [class.selected]="selected" href="{{ href }}" [style.background]="getColor()">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
} @else {
  <div [class]="['card', size]" [class.disabled]="disabled" [class.selected]="selected" [style.background]="getColor()">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </div>
}


<ng-template #content>
  <div class="cardContainer">
    @if (iconBefore) {
      <app-icon [icon]="iconBefore" class="iconBefore"></app-icon>
    }
    <span class="textContent"><ng-content></ng-content></span>
    @if (iconAfter) {
      <app-icon [icon]="iconAfter" class="iconAfter"></app-icon>
    }
  </div>
</ng-template>
